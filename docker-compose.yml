version: '3.8'

services:
  # LiteLLM Proxy Service
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    env_file: .env
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config=/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: "postgresql://llmproxy:litellm_password_123@litellm-db:5432/litellm"
      STORE_MODEL_IN_DB: "${STORE_MODEL_IN_DB}"
      PROMETHEUS_ENABLED: "${PROMETHEUS_ENABLED}"
    depends_on:
      - litellm-db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/liveliness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - litellm-network

  # PostgreSQL Database Service
  litellm-db:
    image: postgres:16
    container_name: litellm-db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-litellm}
      POSTGRES_USER: ${DB_USER:-llmproxy}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME:-litellm} -U ${DB_USER:-llmproxy}"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - litellm-network

  # Prometheus Service
  litellm-prometheus:
    image: prom/prometheus
    container_name: litellm-prometheus
    env_file: .env
    volumes:
      - ./prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: always
    networks:
      - litellm-network

# Docker Network
networks:
  litellm-network:
    driver: bridge
    name: litellm-network